name: Copilot setup steps

# GitHub's Copilot coding agent runs the job below before it starts work, so it
# begins with the same Go, check tools and git hooks as `make setup` gives
# everyone else. It also runs here when this file changes, to prove it still works.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  # Copilot only runs a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      # Credentials are left in place because Copilot works in this checkout and
      # pushes from it. The token is read only here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # staticcheck, govulncheck and the git hooks, at the versions the Makefile pins.
      - name: Setup
        run: make setup

      - name: Tools are on the path
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/staticcheck" -version
          "$(go env GOPATH)/bin/govulncheck" -version
