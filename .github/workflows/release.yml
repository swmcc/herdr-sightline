name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Nothing by default. The release job asks for only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The install script downloads the release named after the manifest version,
      # so a tag that doesn't match it would publish binaries nobody can install.
      - name: Tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -n 1)
          if [ "v$manifest" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version \"$manifest\" in herdr-plugin.toml."
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
