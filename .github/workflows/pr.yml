name: PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - name: Every PR links to an issue
        env:
          # Passed through the environment so the body can never run as part of the script.
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          numbers=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of) #[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$numbers" ]; then
            echo "::error::Link this PR to an issue in its description, for example 'Closes #12' or 'Refs #12'."
            exit 1
          fi

          for n in $numbers; do
            kind=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo missing)
            case "$kind" in
              issue) echo "Linked to issue #$n" ;;
              pr) echo "::error::#$n is a pull request, not an issue."; exit 1 ;;
              *) echo "::error::Issue #$n doesn't exist."; exit 1 ;;
            esac
          done
