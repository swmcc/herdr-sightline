name: PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Nothing by default. Each job asks for only what it needs.
permissions: {}

env:
  # Matches "Closes #12", "fixes #3", "Refs #16", "part of #4" and friends.
  ISSUE_REF: '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of) #[0-9]+'

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Every PR links to an issue
        env:
          # Passed through the environment so the body can never run as part of the script.
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          numbers=$(printf '%s' "$BODY" | grep -oiE "$ISSUE_REF" | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$numbers" ]; then
            echo "::error::Link this PR to an issue in its description, for example 'Closes #12' or 'Refs #12'."
            exit 1
          fi

          for n in $numbers; do
            kind=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo missing)
            case "$kind" in
              issue) echo "Linked to issue #$n" ;;
              pr) echo "::error::#$n is a pull request, not an issue."; exit 1 ;;
              *) echo "::error::Issue #$n doesn't exist."; exit 1 ;;
            esac
          done

  assign:
    name: assign
    # Only for PRs from this repo. Forks get a read only token and their authors
    # can't be assigned anyway.
    if: github.event.action != 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign the author to the PR and its linked issues
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" -R "$REPO" --add-assignee "$AUTHOR"
          echo "Assigned $AUTHOR to #$PR"

          numbers=$(printf '%s' "$BODY" | grep -oiE "$ISSUE_REF" | grep -oE '[0-9]+' | sort -u || true)
          for n in $numbers; do
            if gh issue edit "$n" -R "$REPO" --add-assignee "$AUTHOR" >/dev/null 2>&1; then
              echo "Assigned $AUTHOR to #$n"
            else
              echo "Couldn't assign #$n, the link check will say why"
            fi
          done
