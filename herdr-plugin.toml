id = "swmcc.sightline"
name = "Sightline"
version = "0.0.0"
min_herdr_version = "0.9.1"
description = "Your agents can see the panes next to them"
platforms = ["macos", "linux"]

# Installs bin/sightline. Downloads the release binary matching `version` and checks
# its checksum, or builds from source with Go if that fails. herdr runs this on install
# and on `herdr plugin update`, but not on `herdr plugin link`.
[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "watch"
title = "Sightline: watch this pane"
contexts = ["pane"]
command = ["bin/sightline", "watch"]

[[actions]]
id = "unwatch"
title = "Sightline: stop watching this pane"
contexts = ["pane"]
command = ["bin/sightline", "unwatch"]

# The feed is also the watcher, because herdr plugins can't run background daemons.
[[panes]]
id = "feed"
title = "Sightline"
placement = "split"
command = ["bin/sightline", "feed"]
